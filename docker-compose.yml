version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    environment:
      DATABASE_URL: postgres://crm:crm@db:5432/crm
    ports:
      - "4000:4000"
    depends_on:
      - db

volumes:
  pgdata:
